<script>
const Q=[{"t": "mc", "q": "아동심리의 이해 및 심리학의 역할에 대한 설명으로 옳지 않은 것은?", "o": ["아동심리의 이해는 발달심리학적 이론을 바탕으로 영유아기부터 아동기까지의 신체·인지·정서·사회성 발달과정을 학습한다.", "인간 행동의 규칙을 밝혀 행동을 예측·통제·조절할 수 있게 한다.", "외현적으로 표현된 행동이 어떤 내적 정신작용과 사고과정에서 비롯되었는지 분석한다.", "사회·환경·생활양식 등의 변화가 인간 행동에 어떤 영향을 미치는지 관계를 분석한다.", "행동과 정신은 서로 무관하다는 것을 밝혀 행동만을 독립적으로 다룬다."], "a": 5, "e": "심리학은 '행동과 정신과의 상호관계성'을 밝혀낸다. 나머지는 모두 자료에 제시된 아동심리의 이해 정의와 심리학의 역할이다.", "p": "1–2", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "mc", "q": "심리학의 역사에 등장하는 인물과 주장의 연결로 옳지 않은 것은?", "o": ["플라톤 – 생득설: 특정 지식은 선천적으로 타고난다.", "아리스토텔레스 – 경험론: 모든 지식은 경험으로 얻어진다.", "아우구스티누스 – 철학의 대상은 신과 영혼이다.", "데카르트 – 진화론을 주장하였다.", "다윈 – 진화론을 주장하였다."], "a": 4, "e": "데카르트는 심리학 연구를 철학·신학적 관점에서 과학적 관점으로 이동시키는 계기를 마련한 인물이다. 진화론은 다윈의 주장이다. (심리학은 철학에서 출발해 실험과 관찰을 통해 독립 학문으로 발전)", "p": "2", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "mc", "q": "신경전달물질과 그 기능·이상 시 증상의 연결로 옳지 않은 것은?", "o": ["노르에피네프린 – 경계·각성·학습·기억·섭식 기능, 과다 시 각성과 긴장, 결핍 시 우울", "도파민 – 동작·학습·주의·감정 기능, 과도한 분비 시 파킨슨병, 결핍 시 조현병", "세로토닌 – 기분·배고픔·수면·정서 기능, 결핍 시 우울·섭식장애·중독·불면증", "글루타메이트 – 흥분성 신경전달물질, 과잉 시 편두통·경련", "엔도르핀 – 통증·기쁨 지각, 증가 시 통증 감소와 쾌감(천연 진통제)"], "a": 2, "e": "도파민은 과도한 분비 시 조현병(환각 등), 결핍 시 수전증과 파킨슨병의 발병 원인이 된다. 즉 조현병과 파킨슨병이 서로 바뀌어 연결된 진술이 틀렸다.", "p": "2–3", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "sa", "q": "다음 설명에 해당하는 신경전달물질의 이름을 쓰시오.\n\"주요 억제성 신경전달물질로 불안 감소, 신경안정, 흥분 억제, 근육긴장 조절을 하는 뇌의 브레이크 역할을 한다. 결핍 시 경련·떨림·불면증을 초래하며, 항불안제의 진정효과는 이 물질의 억제작용 결과이다.\"", "a": "GABA(가바)", "e": "자료에서 GABA(본문 표기 'GAVA')는 주요 억제성 신경전달물질이며, 항불안제가 GABA의 억제작용 결과로 진정효과를 낸다고 정리되어 있다.", "p": "3", "hl": true, "s": "Ⅰ. 심리학의 기초", "acc": ["GABA", "GABA(가바)", "GABA가바", "가바"]}, {"t": "mc", "q": "심리학의 접근 방법과 그 설명의 연결로 옳지 않은 것은?", "o": ["생물학적 접근 – 인간 연구의 한계로 동물을 대상으로 뇌·신경계통·호르몬·뇌세포 변성 등 생물학적 기능에 기초해 인간을 연구", "정신분석적 접근 – 무의식적 지배에서 비롯된 행동으로 인간을 이해하려 하며, 원초적 본능과 어린 시절 경험을 지나치게 강조한다는 단점", "인지적 접근 – 인간을 외부 정보를 수용→부호화→처리→저장→인출하는 능동적 존재로 봄", "인본주의적 접근 – 외부 자극에 수동적으로 대처하는 존재가 아닌 자유의지에 의해 능동적으로 대처하는 존재임을 강조", "행동적 접근 – 행동 자체보다 행동이 나타나기까지의 내적 사고과정을 중요시함"], "a": 5, "e": "행동 자체보다 내적 사고과정을 중요시하는 것은 '인지적 접근방법'이다. 행동적 접근은 환경 자극에 대한 반응(행동)을 관찰하며 과정보다 결과를 중시한다.", "p": "2–4", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "mc", "q": "행동적 접근 방법에 대한 설명으로 옳은 것은?", "o": ["무의식적 동기를 분석하는 데 초점을 둔다.", "환경에서 오는 자극에 대한 반응을 관찰하며, 과정보다 결과를 중시한다.", "단점은 인간 행동을 지나치게 복잡하게 해석한다는 것이다.", "관찰 불가능한 내적 정서를 주로 연구하여 실제 적용 가능성이 낮다.", "인간을 자유의지를 가진 능동적 존재로 강조한다."], "a": 2, "e": "행동적 접근은 행동주의 학자들이 주로 사용하며 결과를 중시한다. 장점: 관찰 가능한 행동을 객관적으로 연구해 심리학의 과학화에 기여, 행동수정·학습 등 적용 가능성이 높음. 단점: 내재된 심리·정서를 충분히 고려하지 못하고 행동을 지나치게 단순화함.", "p": "3", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "mc", "q": "심리학의 연구 방법 중 '가장 오랜 기간 이용된 방법'으로, 임상사례를 분석하여 적응문제나 행동장애가 있는 개인을 치료하기 위한 방법(예: 피아제 인지발달 이론)은?", "o": ["실험법", "관찰법", "조사법", "사례연구법", "검사법"], "a": 4, "e": "사례연구법은 가장 오랜 기간 이용한 방법으로 임상사례를 분석한다. 실험법은 가설 설정 후 입증, 관찰법은 자연상태 관찰, 조사법은 면담·설문지, 검사법은 지능·적성·성격·태도검사이다.", "p": "4", "hl": true, "s": "Ⅰ. 심리학의 기초"}, {"t": "mc", "q": "애착 및 볼비(Bowlby)의 이론에 대한 설명으로 옳지 않은 것은?", "o": ["애착은 양육자나 특별한 사회적 대상과 형성하는 친밀한 정서적 관계이다.", "볼비는 양육자의 지속적인 '가용성(필요할 때 곁에 있어주는 것)'에 중점을 두었다.", "내적 작동 모델은 부모와 맺은 관계가 이후의 대인관계 형성에 영향을 미친다는 주장이다.", "내적 작동 모델은 한번 형성되면 고정적이어서 이후 상호작용 상대에 따라 변하지 않는다.", "영아기에 부모와 친밀한 관계가 아니면 이후 심각한 심리적 문제를 초래할 가능성이 있다."], "a": 4, "e": "'작동'은 고정적이지 않고 상호작용 상대에 따라 다양한 형태로 변화할 수 있다는 의미로, 애착을 변화시킬 가능성이 있다(예: 안정형 남편을 만나면 나도 안정형이 됨).", "p": "4", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "볼비의 애착형성 4단계를 순서와 시기에 맞게 바르게 나열한 것은?", "o": ["초기애착(출생~2개월) → 애착형성(6주~8개월) → 애착(6·7·8~18개월) → 상호관계형성(18~24개월)", "애착형성(출생~2개월) → 초기애착(6주~8개월) → 상호관계형성(6·7·8~18개월) → 애착(18~24개월)", "초기애착(출생~6개월) → 애착(6~12개월) → 애착형성(12~18개월) → 상호관계형성(18~36개월)", "초기애착(출생~2개월) → 애착(6주~8개월) → 애착형성(8~18개월) → 상호관계형성(18~24개월)"], "a": 1, "e": "자료에 '볼비의 애착형성 4단계!!!!'로 강조된 내용: ①초기애착(출생~2개월) ②애착형성(6주~8개월) ③애착(6,7,8~18개월) ④상호관계형성(18~24개월).", "p": "5", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "볼비의 애착형성 단계 중 다음 설명에 해당하는 단계는?\n\"양육자와의 애착형성이 확립되며, 기기·걷기 등 이동능력으로 능동적 애착행동이 나타난다. 애착대상을 안전기지로 삼아 주변 환경을 탐색하고, 낯가림과 분리불안이 나타난다.\"", "o": ["초기애착(출생~2개월)", "애착형성(6주~8개월)", "애착(6·7·8~18개월)", "상호관계형성(18~24개월)"], "a": 3, "e": "③ 애착 단계의 특징이다. 초기애착은 사람 구별능력이 없어 모든 사람에게 애착신호를 보내고, 애착형성은 양육자를 향한 분명한 관심과 접근 행동, 상호관계형성은 자기중심 사고에서 벗어나 일방적이 아닌 '쌍방적인 상호관계'로 발달하는 단계이다.", "p": "5", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "할로(Harlow)의 원숭이 대리모 실험이 보여준 결론으로 가장 적절한 것은?", "o": ["젖(먹이)을 주는 대상에게 가장 강한 애착이 형성된다.", "포유류의 생존에는 부드럽고 따뜻한 대상이 중요하며, 접촉위안이 더 중요하게 작용한다.", "애착은 생후 12~18개월에만 형성된다.", "철사 대리모와 천 대리모에 대한 선호 차이는 없다."], "a": 2, "e": "새끼 원숭이는 극히 배고플 때만 젖이 나오는 철사 대리모에게 가고 대부분 천 대리모에 안겨 있었다. 촉각/스킨십이 매우 중요하며 '접촉위안이 더 중요하게 작용'한다.", "p": "5", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "에인스워스(Ainsworth)의 낯선상황실험에서 불안정 애착을 세분화한 유형에 해당하지 않는 것은?", "o": ["불안", "회피", "저항/양가형", "혼란형"], "a": 4, "e": "에인스워스는 12~18개월 영아를 대상으로 안정애착과 불안정애착으로 구분하고, 불안정애착을 불안·회피·저항/양가형으로 세분화했다. 혼란된 유형은 이후 메인(Main)이 발견했다.", "p": "5", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "포나기(Fonagy)의 이론에 대한 설명으로 옳지 않은 것은?", "o": ["정신화는 사람의 행동 뒤에 생각과 마음의 과정이 있다는 것을 이해하는 능력이다.", "정신화 활동을 하려면 성찰적 기능이 필요하다.", "성찰적 기능은 통찰하고 공감하는 능력과 관련된다.", "성찰 능력이 높은 부모는 그렇지 않은 부모에 비해 안정된 자녀를 가질 확률이 높다.", "성찰 능력이 높은 부모라도 자신의 애착경험이 부정적이었다면 자녀는 반드시 불안정애착이 된다."], "a": 5, "e": "성찰 능력이 높은 부모는 자신의 애착경험이 부정적이더라도 자녀를 불안정애착유형으로 키우지 않을 수 있다(형광펜 강조 부분).", "p": "6", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "애착 유형과 그 원인·특징의 연결로 옳지 않은 것은?", "o": ["안정 애착 – 엄마가 아기의 신호에 규칙적으로 일관되게 반응해 왔기 때문에 유아는 엄마가 반응해 줄 것이라는 확신을 가짐", "회피형 – 엄마로부터 반복적인 거절을 받은 경우로, 감정의 상호조절을 경험하지 못하고 자기조절에만 의존함", "저항/양가형 – 엄마가 일관되지 않은 양육태도를 보일 때 나타나며, 부모 반응에 일관성이 없었기 때문", "혼란형 – 불안의 근원이 부모이므로 접근-회피 갈등에 빠져 아무 행동도 할 수 없음, 학대당하는 아이들 등에서 나타남", "회피형 – 엄마에게 과도하게 집착하여 새로운 환경을 탐험하기 어렵고 엄마가 자리를 뜨면 심각한 분리불안을 보임"], "a": 5, "e": "엄마에게 과도하게 집착하고 심각한 분리불안을 보이는 것은 '저항/양가형'의 특징이다. 회피형은 불안한 상황에서도 엄마를 찾지 않고, 돌아와도 무시하거나 피한다.", "p": "6–7", "hl": true, "s": "Ⅱ. 애착"}, {"t": "sa", "q": "다음 빈칸에 들어갈 말을 쓰시오.\n\"애착형성 시기에는 언어가 아닌 감정적으로 느낀 (        ) 기억에 의해 기억된다.\"", "a": "암묵적 (기억)", "e": "암묵적 기억은 감각을 통해 입력되며 언어로 인출하기 어려운 형태로 저장되고 의식적 성찰이 불가능하다. 명시적 기억은 쉽게 언어화할 수 있는 기억이다.", "p": "7", "hl": true, "s": "Ⅱ. 애착", "acc": ["기억", "암묵적", "암묵적 (기억)", "암묵적기억"]}, {"t": "ox", "q": "안정 애착을 예측하는 요인 중 부모의 민감성과 관련하여, 아기의 요구를 거절하는 것보다 요구에 둔감한 양육이 더 해롭다.", "a": "O", "e": "자료에 형광펜으로 '아기 요구 거절하는 것보다 요구에 둔감한 양육이 더 해로움'이라고 강조되어 있다. 둔감·거부·일관성 없는 태도는 불안정 애착을 형성한다.", "p": "7", "hl": true, "s": "Ⅱ. 애착"}, {"t": "mc", "q": "성장·성숙·발달의 개념에 대한 설명으로 옳지 않은 것은?", "o": ["성장은 키·체중·머리둘레 등 신체적 '양적 변화'로 크기나 양의 증가를 의미한다.", "성숙은 신체와 정신이 새로운 단계로 나아가는 '질적 변화'이다.", "발달은 인간에게 나타나는 양적·질적 변화를 모두 포함한다.", "현대 심리학에서는 쇠퇴 과정은 발달에 포함하지 않고 성장만을 발달로 본다."], "a": 4, "e": "현대 심리학에서는 성장뿐만 아니라 쇠퇴 과정도 발달의 일부로 본다.", "p": "9", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "발달의 원리에 대한 설명으로 옳지 않은 것은?", "o": ["성숙과 학습의 상호작용: 유전적 요인(성숙)과 환경적 요인(학습)이 서로 영향을 주며 이루어진다.", "통합과 분화의 과정: 초기의 미분화된 반응에서 점차 세분화·전문화된 행동으로 발달한다.", "일정한 방향성: 머리→발(두미방향), 몸의 중심→말초(중심말초방향)로 발달한다.", "결정적 시기(민감기): 특정 기능·능력이 빨리 발달하는 민감한 시기가 존재한다.", "발달 영역 간 독립성: 각 발달 영역은 서로 영향을 주지 않고 독립적으로 발달한다."], "a": 5, "e": "발달의 원리는 '발달 영역 간 상호연관성'으로, 다양한 영역의 발달은 서로 상호작용하며 발달을 촉진하거나 방해할 수 있다. 그 외 연속적·점진적 과정, 발달 속도의 개인차 등이 있다.", "p": "9–10", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "태내기에 대한 설명으로 옳은 것은?", "o": ["태내기는 수정에서 출생까지로 약 280일(38주)이며, 태아기는 9~38주이다.", "태내기는 약 300일(42주)이며 배아기·태아기의 2단계로 구분된다.", "배종기는 3~8주로 유산이 가장 잘 되지 않는 시기이다.", "태아기는 수정~2주까지를 말한다."], "a": 1, "e": "태내기는 약 280일(38주)이며 3단계로 구분된다: 배종기(수정~2주, 유산이 잘 됨), 배아기(3~8주), 태아기(9~38주).", "p": "10", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "출생 후 생존 가능성이 높은 '생존 가능 연령'에 해당하는 시기와 그 이유로 옳은 것은?", "o": ["12주 전후 – 초음파로 움직임이 관찰되기 때문", "20주 전후 – 태동이 나타나기 때문", "24주 전후 – 빛에 반응하기 때문", "28주 전후 – 7개월부터 혼자 호흡이 가능하기 때문", "36주 전후 – 미각이 완성되기 때문"], "a": 4, "e": "28주 전후는 출생 후 생존 가능성이 높은 생존 가능 연령에 해당한다(7개월부터 혼자 호흡 가능). 형광펜과 빨간 펜 표시로 강조된 부분이다.", "p": "10", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "태아의 운동·감각 발달에 대한 설명으로 옳지 않은 것은?", "o": ["12주: 양수 내 활발한 움직임을 초음파로 관찰할 수 있다.", "20주 전후: 태동이 나타나 산모가 태아의 움직임을 감지한다.", "20~30주: 휴지기와 활동기가 구분되는 생존리듬이 형성된다.", "청각: 약 20주 이후 소리에 반응하며 특히 250~500Hz의 낮은 음에 반응한다.", "시각: 약 12주부터 빛에 반응한다."], "a": 5, "e": "시각은 약 24주부터 빛에 반응한다. 미각은 약 24주경 완성되어 단맛에 반응하고, 약 29주에는 소리 자극에 따라 심박동 반응이 나타난다.", "p": "10", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "신생아기 및 신생아 반사행동에 대한 설명으로 옳지 않은 것은?", "o": ["신생아기는 출생 후 약 2개월간 급격한 환경 변화에 적응하는 시기이다.", "신생아는 하루 18~22시간 얕은 잠을 많이 잔다.", "생애 초기 운동의 대부분은 반사행동이며, 반사검사로 중추신경계 손상 여부를 확인할 수 있다.", "빨기반사는 무언가 입에 닿으면 자동적으로 빠는 행동으로, 나중에 의식적인 빨기 행동으로 바뀐다.", "모로반사는 출생 후 평생 지속되며, 모로반사가 없는 것은 정상 발달의 신호이다."], "a": 5, "e": "모로반사는 큰 소리나 신체 위치의 갑작스러운 변화에 팔을 바깥으로 벌렸다 안으로 모으는 반사로, 3개월경 사라지기 시작해 5~6개월경 완전히 사라진다. 모로반사가 없으면 신경계 손상이나 팔의 마비를 의심한다.", "p": "11–12", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "다음 설명에 해당하는 신생아 반사는?\n\"누워 있는 신생아의 얼굴을 한쪽으로 돌리면 얼굴이 향해 있는 방향으로 팔과 다리를 곧게 뻗고 반대쪽 팔은 굽힌다. 2~3개월경 관찰되고 4~6개월경 사라진다.\"", "o": ["빨기반사", "모로반사", "비대칭 긴장성 목 반사(ATNR)", "파악반사"], "a": 3, "e": "비대칭 긴장성 목 반사(ATNR)의 설명이다. 자료에 '6개월이면 ATNR이 사라져야 함'이라고 되어 있다. (참고: '이 자극을 주면 어떤 행동이 나오는지 알아야함!' 밑줄 강조)", "p": "12", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "영아기 신체 발달에 대한 설명으로 옳은 것은?", "o": ["출생 시 체중은 4개월경 2배, 12개월경 3배가 되고, 신장은 12개월경 1.5배가 된다.", "출생 시 체중은 4개월경 3배, 12개월경 4배가 되고, 신장은 12개월경 2배가 된다.", "출생 시 체중은 6개월경 2배, 24개월경 3배가 된다.", "출생 시 신장은 4개월경 2배가 된다."], "a": 1, "e": "형광펜 강조: 출생 시 체중은 4개월경 2배, 12개월경 3배, 신장은 12개월경 1.5배로 성장한다.", "p": "12", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "영아기 신체 발달에 대한 설명으로 옳지 않은 것은?", "o": ["영아기는 신생아기를 포함하여 생후 1년까지이다(경우에 따라 1년 6개월 또는 3세 미만까지 구분).", "출생 시 머리가 몸보다 크지만 12개월이 되면 동일해지고, 나중에는 몸이 머리보다 더 커진다.", "두개골 결합이 완성되지 못해 소천문은 생후 6주경, 대천문은 15~18개월 사이에 닫힌다.", "유치는 생후 6~7개월경 나기 시작하여 30~36개월 사이에 20개가 나온다.", "대천문은 생후 6주경, 소천문은 15~18개월 사이에 닫힌다."], "a": 5, "e": "소천문이 생후 6주경, 대천문이 15~18개월 사이에 닫힌다. 소천문과 대천문의 시기를 뒤바꾼 진술이 틀렸다.", "p": "12", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "ox", "q": "자료의 영아 운동발달 필기에 따르면, 배밀이와 네발기기 단계는 건너뛰고 가능한 한 빨리 걷는 것이 발달에 가장 좋다.", "a": "X", "e": "그림 4-1 옆 손글씨 필기: 배밀이를 하며 양측협응을 배우고 뇌 발달도 일어나며, 네발기기·배밀이가 중요하고 이를 건너뛰면 감각 통합에 어려움이 생길 수 있어 너무 빨리 걷는 것은 좋지 않다는 취지로 적혀 있다. (손글씨라 일부 판독 불확실)", "p": "13", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "유아기 기억의 특징으로 옳지 않은 것은?", "o": ["욕구와 정서에 관련된 기억이 많다.", "구체물, 현실적 사물에 의해 기억이 유지된다.", "전체 안에 속해 있는 부분적 기억은 가능하지만, 전체적 기억은 하지 못한다.", "기억의 유지 기간은 연령에 따라 점점 증가한다."], "a": 3, "e": "전체적 기억은 가능하지만, 전체 안에 속해 있는 부분적 기억은 하지 못한다. 전체/부분을 반대로 서술한 진술이 틀렸다. (1세 몇 주, 2세 몇 개월, 3세 1년, 4세 1년 이상 회상 가능)", "p": "13", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "유아기에 대한 설명으로 옳지 않은 것은?", "o": ["1세에서 6세까지의 기간으로, 달리고 공을 주고받는 등 운동발달이 이루어진다.", "구체적 생활과 놀이(역할·상상·상징놀이)를 통해 인지가 발달한다.", "중요한 배변 훈련이 시작되는 시기이다.", "4세경 한발뛰기, 가위로 선 자르기, 글자 베껴쓰기가 가능하다.", "배뇨는 개인차가 거의 없으므로 정해진 시기에 맞추어 강하게 훈련해야 한다."], "a": 5, "e": "배뇨는 개인차가 있어서 절대 무리하게 훈련하면 안 된다. (1세경 배변 준비, 1세 반 예고 가능, 2세 반~3세 밤에도 혼자 배뇨 가능)", "p": "13–14", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "아동기에 대한 설명으로 옳지 않은 것은?", "o": ["7세~12세까지이며 초등학교 학령기에 속한다.", "머리보다 다른 신체가 커지면서 균형잡힌 체형이 형성되기 시작하며, 신체발달 속도는 유아기만큼 빠르진 않지만 신체비율 균형을 잡아간다.", "전체적·분석적·관계적 사고가 가능해지고 문법과 문맥적 표현이 발달한다.", "6세 이전에 발달되지 않았던 시력과 시야가 완전히 발달하고, 유치가 빠지고 영구치가 자라기 시작한다.", "대인관계가 또래에서 가족으로 축소된다."], "a": 5, "e": "아동기에는 '가족에서 또래로' 대인관계가 확장된다(형광펜 강조).", "p": "14–15", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "아동기의 체중과 신장 증가율에 따른 구분에서 '충실기'에 대한 설명으로 옳은 것은?", "o": ["신장의 증가율이 체중의 증가율보다 큰 시기", "체중의 증가율이 신장의 증가율보다 큰 시기", "체중과 신장이 모두 감소하는 시기", "머리둘레만 증가하는 시기"], "a": 2, "e": "충실기는 체중이 신장의 증가율보다 큰 시기, 신장기는 신장이 체중의 증가율보다 큰 시기이며, 2단계 4시기로 구분한다.", "p": "15", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "아동기의 운동·지적·사회성 발달에 대한 설명으로 옳지 않은 것은?", "o": ["운동능력이 급속하게 발달한다.", "인지능력은 피아제의 구체적 조작기에 해당한다.", "기억은 수동적 주의집중에서 능동적 주의집중(의지를 가진 것)으로 이동한다.", "또래집단을 잘 형성하여 '갱 에이지'라고 부른다.", "갱 에이지 집단은 개방적이어서 다른 친구 무리가 들어오는 것을 환영한다."], "a": 5, "e": "갱 에이지 집단의 특징은 응집성, 폐쇄적(자기 집단 친구가 중요하고 타 무리가 들어오는 것을 경계), 이타적이다.", "p": "15–16", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "청년기 및 노년기에 대한 설명으로 옳지 않은 것은?", "o": ["청년기는 피아제 인지발달의 형식적 조작기에 해당하며 가설·연역적 추론·추상적 사고능력이 발달한다.", "청년기 사회성 발달의 핵심은 '나를 발견'하는 것이며, 조절할 수 없는 신체 변화로 정신적 변화도 많이 일어난다.", "청년기의 정서적 특징은 불안, 민감성, 이중성이며, 아동에서 성인기로 이동하는 과도기에 놓인다.", "청년기에는 자아의식이 약해지고 타인과 비교하지 않게 된다.", "노년기는 주관성이 강해지고 융통성이 없으며 고집스러워지는 시기이다."], "a": 4, "e": "청년기에는 정신과 육체 변화에 관심이 많아지며 자아의식이 강해지고, 타인과 비교하며 열등감·우월감에 빠지기도 한다(형광펜 강조).", "p": "16–17", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "에릭슨의 8단계 생애주기 표에서 강조(동그라미 표시)된 '2단계: 유아기'의 내용으로 옳은 것은?", "o": ["0~1세 / 신뢰감 대 불신감 / 어머니 / 희망", "2~3세 / 자율성 대 수치감 / 부모 / 의지 / 배변 훈련", "4~6세 / 주도성 대 죄책감 / 가족 / 목적", "7~11세 / 근면성 대 열등감 / 이웃·학교 / 실력"], "a": 2, "e": "2단계 유아기: 2~3세, 자율성 대 수치감, 중요한 대인관계는 부모, 인격적 활동은 의지, 사회·심리적 행동은 잡기·말하기·배변 훈련(밑줄)·옷 갈아입기·질문·탐색이다.", "p": "18 (표 이미지)", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "에릭슨의 8단계 생애주기 중 강조된 '5단계: 청소년기(12~20세)'의 사회·심리적 위험(위기)은?", "o": ["친근감 대 고립감", "생산성 대 침체성", "정체감 대 정체감 혼미", "통합성 대 절망감", "주도성 대 죄책감"], "a": 3, "e": "5단계 청소년기(12~20세): 정체감 대 정체감 혼미, 중요한 대인관계는 또래집단·리더십의 모델, 인격적 활동은 충실, 행동은 자아정체성·타인 존중·사회관계 형성·독립심이다.", "p": "18 (표 이미지)", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "'모라토리움형 인간'에 대한 설명으로 가장 적절한 것은?", "o": ["청소년기에 정체감을 조기에 확립한 사람", "성인기에도 청소년기의 모라토리움이 연장되어 사회적인 의무와 책임을 이행하는 자아를 확립하지 않으려는 상태", "노년기에 삶을 되돌아보며 통합성을 이룬 사람", "유아기에 자율성을 과도하게 획득한 상태"], "a": 2, "e": "형광펜 강조: 성인기에도 청소년기의 모라토리움이 연장되어 사회적 의무와 책임을 이행하는 자아를 확립하지 않으려는 상태(책임·역할 수행을 계속 미루며 의존적 상태에 머무름).", "p": "18", "hl": true, "s": "Ⅲ. 발달과 생애주기"}, {"t": "mc", "q": "수치심의 이론적 접근에 대한 설명으로 옳지 않은 것은?", "o": ["정신역동적 접근 – 자아 이상의 기대에 도달하는 것에 실패하면 수치심이 나타난다고 봄", "청소년기~성인기 – 자신이 정한 기준에 못 미친 결핍상태로 인해 다른 사람에게 버림받지 않을까 하는 무의식적 두려움이 수치심을 야기함", "에릭슨 – 수치심을 자기통제와 자율성을 확보하려는 항문기에 생기는 특징적인 감정으로 봄", "가족체계적 입장 – 수치심이 타인과의 관계, 특히 부모와의 관계 속에서 발생한다고 봄", "에릭슨 – 수치심을 노년기의 통합성 대 절망감 위기에서 처음 생기는 감정으로 봄"], "a": 5, "e": "에릭슨은 수치심을 항문기(자기통제·자율성 확보)의 특징적 감정으로 보았다(형광펜+밑줄). 가족체계적 입장의 예: 부모의 높은 기대에 실패 → 부모 실망 → 아이 상처 → 수치심.", "p": "19", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "수치심에 대한 설명으로 옳지 않은 것은?", "o": ["수치심과 연결된 이차적 정서 반응은 두려움, 비통함, 분노이다.", "수치심 경향이 높은 사람은 타인에게도 분노가 향해 공격성을 높이고 파괴적인 결과를 초래한다.", "수치심 불안은 수줍음, 당혹감, 창피함, 망신과 같은 감정과 연결된다.", "부모의 멸시나 경멸이 내재화되어 자신을 향하면 정신 내적인 감정의 하나인 수치심이 생성된다.", "수치심은 대인관계와 무관한 감정이므로 부모-자녀 관계와는 관련이 없다."], "a": 5, "e": "수치심은 대인관계의 맥락에서 경험되는 정서이며, 많은 학자들이 특히 부모-자녀 관계를 시작으로 본다('부모와 자녀의 관계가 정말 중요!').", "p": "19", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "수치심의 종류와 설명의 연결로 옳지 않은 것은?", "o": ["건전한 수치심 – 정상적인 감정으로, 자신을 변화·발전하도록 동기를 부여해 보다 적응적인 사람이 되도록 도와줌", "완벽주의적 수치심 – 유아의 초기경험과 밀접하며 특히 주양육자와의 관계를 통해 형성됨", "귀속적 수치심 – 주로 1.5~2세 유아가 자신에 대한 의식을 갖기 시작하면서 지니는 자아부정적 수치심", "독성 수치심 – 부모의 사회적으로 비난받을 행동을 감추기 위해 이중적 도덕 판단·행동을 강요받는 가정에서 자란 아동에게 나타남", "무수치심 – 집단 규범과 상응하지 못하는 자신을 발견할 때 느끼는 정상적인 감정"], "a": 5, "e": "무수치심은 사회병리학적 성격(반사회·경계성 인격장애 등)을 지닌 사람에게 나타나며, 어린 시절 애착 대상이 없던 사람들이 무수치심 경향을 보인다. '집단 규범과 상응하지 못하는 자신을 발견할 때 느끼는 감정'은 건전한 수치심에 대한 설명이다. 또한 건전한 수치심 외의 수치심은 병리적 수치심으로 구분된다.", "p": "19–21", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "다음 사례에서 아동이 경험하는 수치심의 종류는?\n\"아빠가 알코올 중독자라서 아이는 집에서는 아빠를 비난하는 엄마에게 동조하지만, 밖에서는 아빠의 문제를 숨기려 노력한다. 아빠를 미워하는 동시에 가족의 명예를 지켜야 하는 이중적 행동을 한다.\"", "o": ["건전한 수치심", "귀속적 수치심", "독성 수치심", "완벽주의적 수치심"], "a": 3, "e": "독성 수치심은 사회적으로 비난받을 수 있는 부모의 모습을 감추기 위해 이중적 도덕 판단이나 행동을 강요받는 가정환경에서 자란 아동에게 주로 나타난다(밑줄 강조: '이중적 행동').", "p": "20", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "학대에 대한 설명으로 옳지 않은 것은?", "o": ["수치심의 핵심 요인은 결핍과 취약성이며, 수치심을 직접적으로 유발하는 것은 학대라고 볼 수 있다.", "학대와 관련된 양육환경의 예로 정서·언어·성적 폭력 속 성장, 방치 속 성장, 외도 등 부모 사이 갈등, 부모의 중독문제·성격장애·완벽주의·과잉보호 등이 있다.", "의도적 학대는 능동적 학대라고도 한다.", "비의도적 학대는 주어서는 안 될 것을 주거나 꼭 줘야 할 것을 주지 못하여 생기는 현상이다.", "방임과 방치는 비의도적이므로 아동에게 버려진 기분을 주지 않는다."], "a": 5, "e": "방임과 방치는 '버려진 기분을 들게 함'(형광펜 강조). 이런 아이들은 자기 욕구를 알지 못하고 감정을 느끼거나 표현하는 것에 수치심·죄책감을 느낀다. 비의도적 학대는 수동적 학대라고도 한다.", "p": "21", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "수치심과 관련된 반응 및 도피경로에 대한 설명으로 옳은 것은?", "o": ["유죄반응 – 자신의 잘못을 감추거나 회피·합리화하며 비현실적 완벽주의를 가짐", "수치반응 – 수치정체감을 가진 사람이 잘못한 후 자신의 잘못을 감추거나 회피·합리화하려 하며, 실수해선 안 된다는 비현실적 완벽주의를 가짐", "회피 – 분노를 자기 파괴적인 행동으로 표출함", "스스로 공격하기 – 술 등 긴장완화 방법으로 수치심을 차단함"], "a": 2, "e": "수치반응의 설명이다. 유죄반응은 잘못을 인정·사과하는 정상 반응이다. 도피경로: 회피 – 술 등으로 수치심 차단·자기도취, 스스로 공격하기 – 분노를 자기 파괴적 행동으로 표출, 그 외 위축·타인 공격하기.", "p": "22", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "중독에 대한 설명으로 옳지 않은 것은?", "o": ["적절한 양육을 받지 못한 경우 내부에서 일어나는 정서를 달래기 위해 외부에 의존한다.", "심리학적 의미의 중독은 더 나은 기분을 위해 특정한 대상에 지나치게 의지하는 것이다.", "중독은 문제의 근원을 이해하는 것이 중요하다.", "일중독은 바쁘게 일함으로써 거절에 대한 내면의 두려움을 해소하고 결핍감을 느낄 여지를 없애 버리는 것이다.", "중독은 근원과 관계없이 겉으로 드러난 행동만 통제하면 제거된다."], "a": 5, "e": "중독의 뿌리를 알 때 중독을 제거할 수 있으므로 보다 본질적인 원인에 접근해야 한다. 일중독 설명은 '다양한 중독 문제' 이미지에서 펜으로 밑줄 친 부분이다.", "p": "23", "hl": true, "s": "Ⅳ. 수치심·학대·중독"}, {"t": "mc", "q": "언어발달 표(이미지)에서 강조된 내용으로 옳지 않은 것은?", "o": ["9개월 이후: 다른 사람의 소리를 듣고 따라하는 타인 소리 모방이 출현한다.", "1세경 과잉축소·과잉확대 같은 과잉 일반화가 출현하며, 과잉확대의 예로 네 발과 꼬리가 있는 동물은 모두 '멍멍이'라고 표현한다.", "2세경 표현적인 자곤이 나타나며, 발음을 활용해 중단·음의 변화·리듬이 포함된 의미 없는 문장 같은 소리를 낸다.", "2세경: 둘 이상의 단어를 연결하여 문장을 형성한다.", "3세경: 약 100개의 어휘를 획득하며 아직 단어 배열에 규칙성을 적용하지 못한다."], "a": 5, "e": "3세경에는 900개 이상의 어휘를 획득하고 단어 배열에 규칙성을 적용하여 언어를 사용한다(문법적인 언어, 어휘·배열 규칙에 대한 빠른 습득 능력 발휘). 과잉축소의 예는 자기의 노란색 모자만을 '모자'로 표현하는 것이다.", "p": "24 (표 이미지)", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "mc", "q": "한국언어재활사협회의 언어발달장애 설명에서 '기질적 요인'에 해당하지 않는 것은?", "o": ["전반적 발달장애", "청각장애", "자폐증", "환경적 언어자극 결핍", "뇌병변장애"], "a": 4, "e": "언어발달 문제의 이유는 기질적 요인과 단순히 언어발달이 늦은 경우로 본다. 기질적 요인: 전반적발달장애, 청각장애, 정서장애, 뇌병변장애, 자폐증 등. 환경적 언어자극 결핍은 '단순히 언어발달이 늦은 경우'에 해당한다.", "p": "25", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "mc", "q": "다음 사례와 가장 관련 깊은 언어발달장애의 결함 영역은?\n\"선생님이 '오늘 날개 달았네?'라고 칭찬하자 아이가 '선생님, 제가 날개를 어떻게 달아요?'라고 대답하였다. 이 아동은 속담 이해에도 어려움을 보인다.\"", "o": ["의미론적 결함", "구문론적 결함", "조음장애", "유창성장애"], "a": 1, "e": "의미론적 결함의 특징: 낱말의 뜻이 은유적으로 쓰일 때 이해하지 못하고 은유적인 표현도 제한된다(밑줄 강조). 의미론적 연구는 표현·수용어휘 수, 어휘 다양도, 의미관계발달, 인지발달과의 관계를 분석한다.", "p": "26", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "mc", "q": "구문론적·화용론적 결함에 대한 설명으로 옳지 않은 것은?", "o": ["구문론은 말의 언어학적 구조와 가장 관련이 깊으며, 대부분 18~24개월이면 2낱말 이상을 결합해 문장을 만들기 시작한다.", "화용론은 화자와 청자가 서로 의도를 인식하고 이해하는 능력으로, 3세 정도면 대화 규칙에 대한 이해가 많이 발달한다.", "화용결함이 있으면 제한된 의사소통 기능만을 나타낸다.", "구문론적 결함이 있으면 화용론적 결함보다 더 비정상적이고 불손한 느낌을 준다."], "a": 4, "e": "화용결함이 있으면 의미론이나 구문론 결함보다도 더 비정상적이고 불손한 느낌을 주기도 한다(형광펜+밑줄). '의미론, 구문론, 화용론 각각의 특징들 알기!!!!!'로 강조된 부분이다.", "p": "26–27", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "mc", "q": "단순언어장애의 조건으로 옳지 않은 것은?", "o": ["언어능력이 정상보다 지체되어 있다.", "지능은 정상범주여야 한다.", "청력에 이상이 없어야 하며 중이염도 없어야 한다.", "뇌손상 및 신경학적 이상을 보이지 않아야 한다.", "사회적 상호작용 능력에 심각한 이상이 있어야 한다."], "a": 5, "e": "단순언어장애는 지능·신경학적 손상 등에 문제없이 언어발달에만 문제를 보이는 아동으로, 사회적 상호작용 능력에 심각한 이상이 '없어야' 한다. 구강구조나 기능에도 이상이 없어야 한다.", "p": "27–28", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "ox", "q": "비특정 언어장애(NLI) 아동은 단순언어장애 아동보다 읽기장애 위험성이 높고, 유전적 영향도 더 크다.", "a": "O", "e": "비특정 언어장애는 단순언어장애보다 읽기장애(본문 표기 '앍기장애') 위험성이 높고(밑줄), 유전적 영향이 크며, 담화능력·문법시제 수행력이 더 낮다.", "p": "28", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "mc", "q": "자폐범주장애(ASD) 아동의 특징으로 옳지 않은 것은?", "o": ["말의 높낮이가 단조롭고 억양이 특이하며, 자기 관심만 일방적으로 말해 대화가 되지 않는다.", "유아기에 사회적 미소가 드물고 눈맞춤이 없으며 낯가림도 없다.", "반향어와 신조어를 사용하고, 한 가지 질문만 되풀이하거나 자기 나름의 일상적 규칙에 집착한다.", "관심 대상이 매우 제한적이고 그 강도나 초점이 비정상적이다.", "협동놀이·역할놀이·상상놀이를 또래보다 잘하며 놀이의 상징성이 풍부하다."], "a": 5, "e": "ASD 아동의 놀이는 단순반복·비사회적이며 협동놀이·역할놀이·상상놀이가 불가능하고 놀이에 상징성이 결여된다(형광펜 강조). 손가락 튕기기, 까치발 걷기 등 상동행동도 많다.", "p": "28–29", "hl": true, "s": "Ⅴ. 언어발달"}, {"t": "sa", "q": "ASD 아동의 언어영역들 중에서 '가장 심한 결함'을 나타내는 영역은 무엇인지 쓰시오.", "a": "화용론(화용론적 측면)", "e": "'(7) 화용론적 언어발달 특성' 이미지에서 '화용론적'에 빨간 펜 동그라미, '화용론적 측면은 언어영역들 중에서 가장 심한 결함'에 형광펜이 표시되어 있다. 의사소통 의도 부족, 교대활동·눈맞추기 어려움, 제한된 의사소통 기능 등이 나타난다.", "p": "32 (이미지)", "hl": true, "s": "Ⅴ. 언어발달", "acc": ["화용론", "화용론(화용론적 측면)", "화용론적 측면", "화용론화용론적 측면"]}, {"t": "mc", "q": "사고와 개념에 대한 설명으로 옳지 않은 것은?", "o": ["사고는 '생각'과 '궁리' 두 가지 행위가 합쳐진 것이다.", "심리학적 사고는 과거의 학습·경험을 동반한 회상이나 추론에 작용하여, 특정 상황에 맞게 필요한 개념을 생성하고 활용한다.", "범주는 분류하여 목록화시켜 놓은 개념이다.", "개념과 범주는 상호보완적 관계를 형성하며 인지와 기억을 효율적으로 처리하도록 돕는다.", "사고는 범주에서 시작하여 개념으로 축소되어 간다."], "a": 5, "e": "'사고는 개념에서 시작하여 범주화되며 확장되어간다'(형광펜+밑줄). 사고는 인간이 문제를 해결하기 위한 접근 방법을 모색할 때 매우 유용하다.", "p": "32–34", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "사고에서 활용되는 개념의 특성에 대한 설명으로 옳지 않은 것은?", "o": ["위계적 구조: 상위개념(생물, 동물, 새)과 하위개념(참새, 까마귀)이 존재한다.", "전형성: '새'라고 하면 타조나 펭귄보다 독수리·비둘기가 먼저 떠오른다.", "개념의 특성은 유연성보다 고정적 성향이 더 강하게 나타난다.", "정확한 개념이 있어야 범주화가 가능하다."], "a": 3, "e": "개념의 특성(위계적 구조·전형성)은 고정적이라기보다 '유연성의 성향이 더 강하게 나타난다'(밑줄 강조).", "p": "33", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "확산적 사고에 포함되는 사고능력('감유융독정')에 해당하지 않는 것은?", "o": ["감수성", "유창성", "수렴성", "독창성", "정교성"], "a": 3, "e": "확산적 사고에 포함되는 사고능력은 감수성, 유창성, 독창성, 융통성, 정교성의 5가지이다(형광펜+밑줄, '5개!!!!!!!'). 수렴적 사고는 하나의 정답을 찾는 별개의 사고 유형이다.", "p": "35", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "연역적 추론의 예로 자료에 제시된 것끼리 짝지은 것은?", "o": ["조건추론, 삼단추론", "확증편향, 조건추론", "시행착오, 삼단추론", "확증편향, 발견전략"], "a": 1, "e": "연역적 추론은 일반적 원리에서 출발해 결론을 이끄는 사고로, 예로 조건추론(만약 A이면 B다)과 삼단추론(대전제·소전제·결론, 소크라테스 예시)이 있다(밑줄 강조). 확증편향은 귀납적 추론에서 나타나는 대표적 오류이다.", "p": "36–37", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "문제해결전략 중 다음 설명에 해당하는 것은?\n\"인간이 자주 사용하는 방법으로, 지금까지 경험한 것과 유사한 문제를 해결할 때 과거에 성공적으로 해결했던 방법을 선택해 해결하며 성공확률이 높다.\"", "o": ["시행착오전략", "발견전략", "연산전략", "확산전략"], "a": 2, "e": "발견전략의 설명이다(파란 펜 동그라미+밑줄). 시행착오전략은 사전경험이 전혀 없을 때 시도하는 방법, 연산전략은 어려운 문제에서 실패 원인을 고려해 계산된 방법을 사용하는 것이다.", "p": "37", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "사고의 방해요소와 문제 해결 과정의 오류에 대한 설명으로 옳지 않은 것은?", "o": ["고착된 기능은 특정 문제를 해결할 때 익숙한 방법·도구·정보만 사용하는 것으로, 컵을 마시는 용도로만 생각하는 것이 예이다.", "가용성 오류는 자기가 경험했던 제한된 정보에 대한 기억을 토대로 전체 문제를 추론할 때 발생한다.", "오류는 판단을 비논리적·비합리적으로 만들기 쉬우므로, 논리성과 합리성을 확보하기 위해 다양한 정보를 탐색하고 신중하게 판단해야 한다.", "문제 해결 결과가 좋지 않을 때는 사고를 방해하는 요소가 작용했는지, 사고 과정 중 오류를 범했는지 살펴본다.", "과신오류는 과거에 일어났던 확률을 미래에 일어날 확률에 대입하는 과정에서 발생한다."], "a": 5, "e": "과거 확률을 미래 확률에 대입하며 발생하는 것은 '대표성 오류'이다. 과신오류는 자신의 능력이 우월하다는 의식으로 자신을 믿고 판단·결정할 때 발생한다.", "p": "38–39", "hl": true, "s": "Ⅵ. 사고"}, {"t": "mc", "q": "피아제의 인지발달 이론에 빗댄 놀이이론의 연결로 옳은 것은?", "o": ["연습놀이 – 전조작기, 7세 이상", "상징놀이 – 감각운동기, 2세 미만", "규칙이 있는 게임 – 7세 이상, 구체적 조작기", "연습놀이 – 형식적 조작기, 12세 이상"], "a": 3, "e": "연습놀이: 감각운동기, 2세 미만(언어 사용 이전의 놀이형태) / 상징놀이: 전조작기(2~7세), 상상을 통한 놀이 / 규칙이 있는 게임: 7세 이상 구체적 조작기, 집단 개념을 이해하고 규칙을 따름. 모두 밑줄 강조된 내용이다.", "p": "39", "hl": true, "s": "Ⅶ. 놀이와 사회성기술"}, {"t": "mc", "q": "작업치료에서의 놀이 관련 학자와 내용의 연결로 옳지 않은 것은?", "o": ["Mary Reilly – 작업행동이론: 아동기 3단계 놀이발달(탐색단계, 능력행동단계, 성취단계)", "Takata – 놀이력 개발: 6단계 놀이 분류를 통해 놀이 단계 파악", "Knox – 놀이척도 개발(공간관리, 놀이감 관리, 모방, 참여), 이후 KPPS로 개정", "Bundy – 놀이다움평가(TOP) 개발: 놀이의 과정보다 결과(무엇을 성공했는지)를 중시"], "a": 4, "e": "Bundy의 TOP는 '놀이의 결과보다 과정 중시'(밑줄)로, 무엇을 성공했는지보다 어떻게 했는지, 놀이를 하며 즐거웠는지가 중요하다.", "p": "40", "hl": true, "s": "Ⅶ. 놀이와 사회성기술"}, {"t": "mc", "q": "놀이를 통한 감각통합 및 사회성기술에 대한 설명으로 옳지 않은 것은?", "o": ["놀이는 언어적 표현이 어려운 아동이 자신의 생각을 전달할 수 있는 대안적 의사소통 수단을 제공한다.", "사회성기술의 네 가지 영역은 소통기술, 대인관계 기술, 자기조절능력, 집단생활 기술이다.", "대인관계 기술은 특히 ASD 아동이, 자기조절능력은 특히 ADHD 아동이 약하다.", "재미있는 놀이를 통해 사회성 기술을 자연스럽게 익힐 기회를 만들어 주는 것이 중요하다.", "사회성기술 놀이에서는 즐거움보다 결과(성과)가 핵심이다."], "a": 5, "e": "자료에 '결과보단 즐거움이 핵심!!!!'이라고 밑줄로 강조되어 있다.", "p": "40–41", "hl": true, "s": "Ⅶ. 놀이와 사회성기술"}, {"t": "mc", "q": "발달단계에 따른 놀이와 사회성기술(이미지 표)에 대한 설명으로 옳지 않은 것은?", "o": ["평행놀이(2~3세) – 같은 공간에서 비슷한 놀이를 하지만 직접 함께 놀지는 않고 각각 독립적으로 놀이함", "연합놀이(3~4세) – 함께 놀기는 하지만 공통 목적이나 정확한 규칙이 없으며, 물건을 빌리고 빌려주면서 대인관계를 배워감", "협동놀이(4~6세 이후) – 공통 목표를 가지고 놀며 리더십(주도성)·팔로워십(협동성) 같은 고난도 사회성 기술이 발달", "규칙성놀이(5세 이후) – 보드게임이나 스포츠처럼 정해진 규칙을 따라 행동하고 승패를 겨루는 놀이가 많아짐(경쟁 개념)", "혼자놀이(0~1세) – 공통 목표를 가지고 역할을 분담하며 협동하는 놀이"], "a": 5, "e": "혼자놀이(0~1세)는 다른 아이가 옆에 있어도 독립적으로 자기 놀이에 집중하는 시기로, 사회성기술이 거의 발달하지 않은 단계이다. 평행·연합놀이는 빨간 펜 동그라미·별표, '대인관계를 배워감'·리더십/팔로워십·규칙성놀이 문장은 펜 밑줄/동그라미로 강조되어 있다.", "p": "42–43 (표 이미지)", "hl": true, "s": "Ⅶ. 놀이와 사회성기술"}];
const K='adong_quiz_v1',app=document.getElementById('app'),N='①②③④⑤⑥⑦⑧';
let S;
function fresh(list){return{list:list||Q.map((_,i)=>i),pos:0,score:0,ans:{},graded:false,cur:null,wrong:[]};}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.list))return s}catch(e){}return null}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/\s+/g,'').toLowerCase();
function corr(q){return q.t==='mc'?N[q.a-1]+' '+q.o[q.a-1]:q.a}
function check(q,v){if(q.t==='sa'){const n=norm(v);return n!==''&&q.acc.some(a=>norm(a)===n)}return v===q.a}
function render(){
 if(S.view==='list')return list();if(S.pos>=S.list.length)return end();
 const qi=S.list[S.pos],q=Q[qi],r=S.ans[qi],g=!!r,dn=done();
 let h=`<div class="bar"><span>진행 ${S.pos+1}/${S.list.length}${S.list.length<Q.length?' (오답 재도전)':''}</span><span>점수 ${S.score} / ${dn}</span></div>
 <div class="pb"><i style="width:${dn/S.list.length*100}%"></i></div><div class="card">
 <div class="sec">${esc(q.s)}</div><div class="meta">문제 ${qi+1} · ${q.t==='mc'?'객관식':q.t==='ox'?'O/X':'단답형'} ${q.hl?'★':''} [p.${esc(q.p)}]</div>
 <div class="q">${esc(q.q)}</div>`;
 if(q.t==='mc')q.o.forEach((o,i)=>{let c='';if(g){if(i+1===q.a)c='ok';else if(r&&r.v===i+1)c='ng'}else if(S.cur===i+1)c='sel';
  h+=`<button class="opt ${c}" data-v="${i+1}" ${g?'disabled':''}><b>${N[i]}</b><span>${esc(o)}</span></button>`});
 else if(q.t==='ox'){h+='<div class="ox">';['O','X'].forEach(v=>{let c='';if(g){if(v===q.a)c='ok';else if(r&&r.v===v)c='ng'}else if(S.cur===v)c='sel';
  h+=`<button class="opt ${c}" data-v="${v}" ${g?'disabled':''}>${v}</button>`});h+='</div>'}
 else h+=`<input type="text" id="sa" placeholder="정답을 입력하세요" value="${esc(g?(r?r.v:''):(S.cur||''))}" ${g?'disabled':''}>`;
 if(!g)h+=`<div class="btns"><button class="b" id="grade" ${S.cur==null||S.cur===''?'disabled':''}>채점</button></div>`;
 else{h+=`<div class="res ${r.ok?'ok':'ng'}"><h3>${r.ok?'⭕ 정답입니다':'❌ 오답입니다'}</h3>${q.t==='sa'?'입력: '+esc(r.v||'(없음)')+'\n':''}<b>정답:</b> ${esc(corr(q))}\n\n<b>풀이:</b> ${esc(q.e)}\n<span class="meta">출처 p.${esc(q.p)}</span></div><div class="btns">`;
  if(q.t==='sa'&&!r.ok)h+=`<button class="b y" id="self">정답으로 처리</button>`;
  h+=`</div>`}
 h+=`<div class="btns"><button class="b g" id="prev" ${S.pos?'':'disabled'}>◀ 이전 문제</button><button class="b" id="next" ${S.pos+1<S.list.length?'':'disabled'}>다음 문제 ▶</button></div><div class="btns"><button class="b y" id="lst">전체 문제 목록</button>${dn===S.list.length?'<button class="b" id="fin">결과 보기</button>':''}</div>`;
 h+=`</div><div class="btns"><button class="b g" id="restart">처음부터 다시</button></div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{S.cur=q.t==='mc'?+b.dataset.v:b.dataset.v;save();render()});
 const inp=document.getElementById('sa');if(inp&&!g){inp.oninput=()=>{S.cur=inp.value;save();document.getElementById('grade').disabled=!inp.value.trim()};
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())grade()};inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l)}
 const $=id=>document.getElementById(id);
 if($('grade'))$('grade').onclick=grade;$('next').onclick=next;$('prev').onclick=()=>go(S.pos-1);$('lst').onclick=()=>{S.view='list';save();render();scrollTo(0,0)};if($('fin'))$('fin').onclick=()=>{S.pos=S.list.length;save();render();scrollTo(0,0)};
 if($('self'))$('self').onclick=()=>{r.ok=true;S.score++;S.wrong=S.wrong.filter(x=>x!==qi);save();render()};
 $('restart').onclick=()=>{if(confirm('처음부터 다시 시작할까요?')){S=fresh();save();render();scrollTo(0,0)}};
}
function grade(){const qi=S.list[S.pos],q=Q[qi],v=S.cur;if(v==null||v==='')return;const ok=check(q,v);
 S.ans[qi]={v,ok};if(ok)S.score++;else S.wrong.push(qi);S.cur=null;save();render()}
function next(){go(S.pos+1)}
function done(){return S.list.filter(i=>S.ans[i]).length}
function go(p){if(p<0||p>=S.list.length)return;S.pos=p;S.view='';S.cur=null;save();render();scrollTo(0,0)}
function list(){const n=S.list.length,dn=done();let h=`<div class="bar"><span>전체 문제 목록 (${dn}/${n} 풀이)</span><span>점수 ${S.score} / ${dn}</span></div><div class="card"><table class="tb"><tr><th>번호</th><th>문제</th><th>상태</th></tr>`+S.list.map((i,k)=>{const r=S.ans[i],t=Q[i].q.split('\n')[0];const st=r?(r.ok?'<span style="color:#1a7f37">정답 O</span>':'<span style="color:#c62828">오답 X</span>'):'<span style="color:#888">미풀이</span>';return `<tr class="rw" data-k="${k}" style="cursor:pointer${k===S.pos?';background:#eef':''}"><td>${i+1}</td><td style="text-align:left">${esc(t.length>40?t.slice(0,40)+'…':t)}</td><td>${st}</td></tr>`}).join('')+`</table><div class="btns"><button class="b" id="back">현재 문제로</button>${dn===n?'<button class="b y" id="fin">결과 보기</button>':''}</div></div>`;
 app.innerHTML=h;app.querySelectorAll('tr.rw').forEach(tr=>tr.onclick=()=>go(+tr.dataset.k));
 document.getElementById('back').onclick=()=>go(Math.min(S.pos,n-1));const f=document.getElementById('fin');if(f)f.onclick=()=>{S.view='';S.pos=n;save();render();scrollTo(0,0)}}
function ua(q,r){if(!r)return '(미응답)';if(q.t==='mc')return N[r.v-1]||'';return r.v||'(없음)'}
function ca(q){return q.t==='mc'?N[q.a-1]:q.a}
function review(qi){const q=Q[qi],r=S.ans[qi];let h=`<div class="card"><div class="sec">${esc(q.s)}</div><div class="meta">문제 ${qi+1} · 복습 모드 [p.${esc(q.p)}]</div><div class="q">${esc(q.q)}</div>`;
 if(q.t==='mc')q.o.forEach((o,i)=>{const c=i+1===q.a?'ok':(r&&r.v===i+1?'ng':'');h+=`<div class="opt ${c}"><b>${N[i]}</b><span>${esc(o)}</span></div>`});
 h+=`<div class="res ${r&&r.ok?'ok':'ng'}"><h3>${r&&r.ok?'⭕ 정답':'❌ 오답'}</h3><b>내 답:</b> ${esc(ua(q,r))}\n<b>정답:</b> ${esc(corr(q))}\n\n<b>풀이:</b> ${esc(q.e)}</div><div class="btns"><button class="b" id="back">결과표로 돌아가기</button></div></div>`;
 app.innerHTML=h;scrollTo(0,0);document.getElementById('back').onclick=()=>{end();const e=document.getElementById('row'+qi);if(e)e.scrollIntoView({block:'center'})}}
function end(){const n=S.list.length;let h=`<div class="card"><h2>결과</h2><div class="big">${S.score} / ${n}</div><div style="text-align:center">${Math.round(S.score/n*100)}점</div>`;
 if(S.wrong.length){h+=`<h3>틀린 문제 (${S.wrong.length})</h3><ul class="wl">`+S.wrong.map(i=>`<li><b>문제 ${i+1}</b> ${esc(Q[i].q.split('\n')[0])}<br><span class="meta">정답: ${esc(corr(Q[i]))}</span></li>`).join('')+'</ul>';
  h+=`<div class="btns"><button class="b y" id="retry">틀린 문제만 다시 풀기</button></div>`}else h+='<p style="text-align:center">🎉 모두 맞혔습니다!</p>';
 h+=`<h3>전체 답안표</h3><table class="tb"><tr><th>번호</th><th>내 답</th><th>정답</th><th>결과</th></tr>`+S.list.map(i=>{const q=Q[i],r=S.ans[i];return `<tr class="rw" id="row${i}" data-i="${i}"><td>${i+1}</td><td>${esc(ua(q,r))}</td><td>${esc(ca(q))}</td><td class="mk" style="color:${r&&r.ok?'#1f9d55':'#e3342f'}">${r&&r.ok?'O':'X'}</td></tr>`}).join('')+'</table>';
 h+=`<div class="btns"><button class="b g" id="restart">처음부터 다시</button></div></div>`;app.innerHTML=h;
 app.querySelectorAll('tr.rw').forEach(tr=>tr.onclick=()=>review(+tr.dataset.i));
 const r=document.getElementById('retry');if(r)r.onclick=()=>{S=fresh(S.wrong.slice());save();render()};
 document.getElementById('restart').onclick=()=>{S=fresh();save();render()};}
try{S=load()||fresh();render();}catch(e){try{S=fresh();render();}catch(e2){window.__showErr&&__showErr(e2&&e2.stack||e2)}}
</script></body></html>
